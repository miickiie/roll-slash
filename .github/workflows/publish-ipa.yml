name: Publish SideStore IPA

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

# Queue main builds instead of cancelling them when another push arrives.
concurrency:
  group: publish-ipa-${{ github.ref }}
  queue: max
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  publish:
    if: github.ref == 'refs/heads/main'
    runs-on: xcode-27
    timeout-minutes: 30

    env:
      DEVELOPER_DIR: /Applications/Xcode_27.0.app/Contents/Developer
      GH_TOKEN: ${{ github.token }}
      RELEASE_TAG: build-${{ github.run_number }}-${{ github.run_attempt }}

    steps:
      - name: Check out the pushed commit
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Build unsigned iPhone app
        run: |
          xcodebuild \
            -project RollSlash.xcodeproj \
            -scheme RollSlash \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CURRENT_PROJECT_VERSION="${GITHUB_RUN_NUMBER}.${GITHUB_RUN_ATTEMPT}" \
            build

      - name: Package IPA and generate SideStore source
        run: |
          mkdir -p dist/Payload

          ditto \
            build/Build/Products/Release-iphoneos/RollSlash.app \
            dist/Payload/RollSlash.app

          cp \
            RollSlash/Resources/Assets.xcassets/AppIcon.appiconset/RollSlashIcon.png \
            dist/icon.png

          (
            cd dist
            zip -qry RollSlash.ipa Payload
          )

          python3 - <<'PY'
          import datetime
          import json
          import os
          import pathlib
          import plistlib

          dist = pathlib.Path("dist")
          info = plistlib.loads(
              (dist / "Payload/RollSlash.app/Info.plist").read_bytes()
          )
          repo = os.environ["GITHUB_REPOSITORY"]
          tag = os.environ["RELEASE_TAG"]
          base = f"https://github.com/{repo}/releases/download/{tag}"
          source_url = f"https://github.com/{repo}/releases/latest/download/source.json"

          source = {
              "name": "RollSlash",
              "identifier": "com.rollslash.source",
              "sourceURL": source_url,
              "apps": [{
                  "name": "RollSlash",
                  "bundleIdentifier": info["CFBundleIdentifier"],
                  "developerName": "Mickey",
                  "localizedDescription": "Organize your photo library with RollSlash.",
                  "iconURL": f"{base}/icon.png",
                  "versions": [{
                      "version": info["CFBundleShortVersionString"],
                      "buildVersion": info["CFBundleVersion"],
                      "date": datetime.datetime.now(datetime.timezone.utc).isoformat(),
                      "downloadURL": f"{base}/RollSlash.ipa",
                      "size": (dist / "RollSlash.ipa").stat().st_size,
                      "minOSVersion": info["MinimumOSVersion"]
                  }],
                  "appPermissions": {
                      "entitlements": [],
                      "privacy": {
                          key: value for key, value in info.items()
                          if key.startswith("NS") and key.endswith("UsageDescription")
                      }
                  }
              }],
              "news": []
          }

          (dist / "source.json").write_text(
              json.dumps(source, indent=2) + "\n", encoding="utf-8"
          )
          PY

      - name: Keep latest release from moving to an older build
        id: latest
        run: |
          python3 - <<'PY'
          import json
          import os
          import re
          import urllib.error
          import urllib.request

          repo = os.environ["GITHUB_REPOSITORY"]
          request = urllib.request.Request(
              f"{os.environ['GITHUB_API_URL']}/repos/{repo}/releases/latest",
              headers={
                  "Accept": "application/vnd.github+json",
                  "Authorization": f"Bearer {os.environ['GH_TOKEN']}",
                  "X-GitHub-Api-Version": "2022-11-28"
              }
          )
          latest_tag = ""
          try:
              with urllib.request.urlopen(request, timeout=30) as response:
                  latest_tag = json.load(response)["tag_name"]
          except urllib.error.HTTPError as error:
              if error.code != 404:
                  raise

          previous = re.fullmatch(r"build-(\d+)-(\d+)", latest_tag)
          current = (
              int(os.environ["GITHUB_RUN_NUMBER"]),
              int(os.environ["GITHUB_RUN_ATTEMPT"])
          )
          promote = previous is None or current > tuple(map(int, previous.groups()))
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write(f"promote={str(promote).lower()}\n")
          PY

      - name: Publish IPA, icon, and source in a GitHub release
        env:
          PROMOTE_RELEASE: ${{ steps.latest.outputs.promote }}
        run: |
          gh release create "$RELEASE_TAG" \
            dist/RollSlash.ipa \
            dist/source.json \
            dist/icon.png \
            --target "$GITHUB_SHA" \
            --title "RollSlash build ${GITHUB_RUN_NUMBER}.${GITHUB_RUN_ATTEMPT}" \
            --notes "Automatic main build ${GITHUB_SHA}." \
            --latest="$PROMOTE_RELEASE"
